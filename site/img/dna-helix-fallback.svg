<?xml version="1.0" encoding="UTF-8"?>
<!--
  MAVERICK DNA helix -- static SVG fallback.
  Renders when Three.js can't load (no-WebGL devices, prefers-reduced-motion,
  hardware gate fails, bundle fetch errors). Also shown briefly at first paint
  before the WebGL scene takes over. Designed to be visually worthy of the
  hero position on its own: this is not a loading placeholder.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="DNA double helix representing the active trading champion">
    <defs>
        <radialGradient id="node" cx="0.35" cy="0.35" r="0.7">
            <stop offset="0%"   stop-color="#fff2a8" stop-opacity="1"/>
            <stop offset="40%"  stop-color="#ffd700" stop-opacity="1"/>
            <stop offset="100%" stop-color="#b88800" stop-opacity="1"/>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="strand" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#ffd700" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#ffd700" stop-opacity="0.25"/>
        </linearGradient>
    </defs>

    <!-- strand 1 sine wave (left -> right -> left) -->
    <path d="M 200 30 Q 300 80 200 130 Q 100 180 200 230 Q 300 280 200 330 Q 100 380 200 430 Q 300 480 200 530 Q 100 580 200 570"
          fill="none" stroke="url(#strand)" stroke-width="2" stroke-linecap="round"/>
    <!-- strand 2 sine wave (180 deg phase: right -> left -> right) -->
    <path d="M 200 30 Q 100 80 200 130 Q 300 180 200 230 Q 100 280 200 330 Q 300 380 200 430 Q 100 480 200 530 Q 300 580 200 570"
          fill="none" stroke="url(#strand)" stroke-width="2" stroke-linecap="round"/>

    <!-- cross-bridges every other node pair -->
    <line x1="140" y1="80"  x2="260" y2="80"  stroke="#f5f5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="260" y1="180" x2="140" y2="180" stroke="#f5f5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="140" y1="280" x2="260" y2="280" stroke="#f5f5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="260" y1="380" x2="140" y2="380" stroke="#f5f5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="140" y1="480" x2="260" y2="480" stroke="#f5f5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="260" y1="580" x2="140" y2="580" stroke="#f5f5fa" stroke-opacity="0.22" stroke-width="1.2"/>

    <!-- strand 1 nodes (14) -->
    <g filter="url(#glow)">
        <circle cx="200" cy="30"  r="8" fill="url(#node)"/>
        <circle cx="260" cy="80"  r="8" fill="url(#node)"/>
        <circle cx="200" cy="130" r="8" fill="url(#node)"/>
        <circle cx="140" cy="180" r="8" fill="url(#node)"/>
        <circle cx="200" cy="230" r="8" fill="url(#node)"/>
        <circle cx="260" cy="280" r="8" fill="url(#node)"/>
        <circle cx="200" cy="330" r="8" fill="url(#node)"/>
        <circle cx="140" cy="380" r="8" fill="url(#node)"/>
        <circle cx="200" cy="430" r="8" fill="url(#node)"/>
        <circle cx="260" cy="480" r="8" fill="url(#node)"/>
        <circle cx="200" cy="530" r="8" fill="url(#node)"/>
        <circle cx="140" cy="580" r="8" fill="url(#node)"/>
    </g>

    <!-- strand 2 nodes (the counterpart at phase-shift pi) -->
    <g filter="url(#glow)" opacity="0.92">
        <circle cx="140" cy="80"  r="7" fill="url(#node)"/>
        <circle cx="260" cy="180" r="7" fill="url(#node)"/>
        <circle cx="140" cy="280" r="7" fill="url(#node)"/>
        <circle cx="260" cy="380" r="7" fill="url(#node)"/>
        <circle cx="140" cy="480" r="7" fill="url(#node)"/>
        <circle cx="260" cy="580" r="7" fill="url(#node)"/>
    </g>

    <!-- ambient floating particles drifting upward -->
    <g opacity="0.55">
        <circle cx="60"  cy="520" r="1.2" fill="#ffd700"/>
        <circle cx="340" cy="480" r="1.2" fill="#ffd700"/>
        <circle cx="80"  cy="360" r="1.4" fill="#ffd700"/>
        <circle cx="320" cy="260" r="1.2" fill="#ffd700"/>
        <circle cx="50"  cy="180" r="1.0" fill="#ffd700"/>
        <circle cx="350" cy="120" r="1.4" fill="#ffd700"/>
    </g>
</svg>
